[package]
name = "wireguard-studio-gui"
version.workspace = true
edition.workspace = true
description = "Desktop GUI for building WireGuard configurations (Rust/egui port of wireguard_gui.py)"

[[bin]]
name = "wireguard-studio"
path = "src/main.rs"

[dependencies]
wgcore = { path = "../wgcore" }
eframe = "0.28"
egui = "0.28"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
