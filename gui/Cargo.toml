[package]
name = "wireguard-studio-gui"
version.workspace = true
edition.workspace = true
description = "Desktop GUI for building WireGuard configurations (Rust/egui port of wireguard_gui.py)"

[[bin]]
name = "wireguard-studio"
path = "src/main.rs"

[dependencies]
wgcore = { path = "../wgcore" }
eframe = "0.36"
egui = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
anyhow = "1.0"
dirs = "5.0"
chrono = "0.4"
opener = { version = "0.7", features = ["reveal"] }
